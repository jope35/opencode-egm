name: E2E

on:
  workflow_dispatch:
    inputs:
      model:
        description: "Provider/model[#variant] for the e2e session"
        required: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Install OpenCode
        run: curl -fsSL https://opencode.ai/v2/install | bash -s -- --version 2.2.4 --no-modify-path
      - run: echo "OPENCODE_BIN=$HOME/.opencode/bin/opencode" >> "$GITHUB_ENV"
      - run: bun install --frozen-lockfile
      - run: bun test test/e2e.test.ts
        env:
          OPENCODE_E2E: "1"
          OPENCODE_E2E_MODEL: ${{ inputs.model }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GOOGLE_GENERATIVE_AI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
