name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - run: bun test
      - run: bunx tsc --noEmit

  integration:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        opencode: ["2.2.4", "2.2.5"]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/cache@v4
        with:
          path: ~/.opencode/bin
          key: opencode-${{ runner.os }}-${{ matrix.opencode }}
      - name: Install OpenCode
        run: curl -fsSL https://opencode.ai/v2/install | bash -s -- --version ${{ matrix.opencode }} --no-modify-path
      - run: echo "OPENCODE_BIN=$HOME/.opencode/bin/opencode" >> "$GITHUB_ENV"
      - run: bun install --frozen-lockfile
      - run: bun test test/integration.test.ts

  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun scripts/sync-upstream.mjs --check
